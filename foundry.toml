[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
optimizer = true
optimizer_runs = 200
via_ir = true
allow_paths = ["../periphery-v3"]
suppress_warnings = ["lint"]
silence_warnings = true
remappings = [
    "src/=src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@ambitlabs/delegate-contracts/=lib/delegate-contracts/src/" 
] 
fs_permissions = [
  { access = "read-write", path = "deployments" }
]

[lint]
lint_on_build = false
exclude_paths = ["src/test/", "script/", "src/mocks/"]

[fmt]
line_length = 120
tab_width = 2
bracket_spacing = true

[rpc_endpoints] 
local = "http://127.0.0.1:8545"
eth = "https://rpc.flashbots.net"
avax = "https://api.avax.network/ext/bc/C/rpc"
plume = "https://rpc.plume.org"
plume-testnet = "https://testnet-rpc.plume.org"
hyperevm = "https://api.hyperliquid.xyz/evm"
hyperevm-testnet = "https://api.hyperliquid-testnet.xyz/evm"